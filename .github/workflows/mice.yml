name: Feed the mouse

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths: ["mice/**", ".github/workflows/mice.yml"]

permissions:
  contents: write

jobs:
  mice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python mice/mice.py
        env:
          GH_USER: ${{ github.repository_owner }}
      - name: Commit as the repo owner (no extra contributor)
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update contribution mouse"
          git push
